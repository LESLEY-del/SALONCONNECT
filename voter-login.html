<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalonConnect - Client Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans flex flex-col min-h-screen">

    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-indigo-600">SalonConnect</h1>
            <a href="landing.html" class="text-gray-600 hover:text-indigo-600 font-medium text-sm">Back to Home</a>
        </div>
    </nav>

    <main class="max-w-md mx-auto px-4 py-12 flex-grow w-full flex items-center justify-center">
        <div class="bg-white p-8 rounded-2xl shadow-md border border-gray-100 space-y-6 w-full">
            <div class="text-center space-y-1">
                <span class="text-[10px] font-black uppercase tracking-widest text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full border border-indigo-100">Voter Portal</span>
                <h2 class="text-2xl font-black text-gray-900 mt-2">Client Login</h2>
                <p class="text-xs text-gray-400">Log in with your email or username to cast your secure vote.</p>
            </div>

            <form onsubmit="handleVoterLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wide text-gray-700 mb-1">Email or Username</label>
                    <input type="text" id="login-identifier" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="Enter email or username">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wide text-gray-700 mb-1">Password</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="••••••••">
                </div>

                <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl hover:bg-indigo-700 transition font-bold text-xs uppercase tracking-wider shadow-md shadow-indigo-100">Log In</button>
            </form>
            
            <p class="text-xs text-center text-gray-500">
                Don't have a voter account? 
                <a href="voter-register.html" class="text-indigo-600 font-bold hover:underline">Register here</a>
            </p>
        </div>
    </main>

    <footer class="bg-white text-gray-600 py-4 border-t border-gray-200 text-center">
        <p class="text-xs text-gray-400">&copy; 2026 SalonConnect. All rights reserved.</p>
    </footer>

    <script>
        const BACKEND_URL = window.location.hostname === 'localhost' 
    ? 'http://localhost:5000/api' 
    : 'https://salonconnect-jbo2.onrender.com/api';

        async function handleVoterLogin(event) {
            event.preventDefault();
            const identifier = document.getElementById('login-identifier').value.trim();
            const password = document.getElementById('login-password').value.trim();

            try {
                const response = await fetch(`${BACKEND_URL}/voters/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });

                const result = await response.json();

                if (response.ok) {
                    localStorage.setItem('voterToken', result.token);
                    localStorage.setItem('voterUser', JSON.stringify(result.voter));
                    alert("Logged in successfully!");
                    window.location.href = 'user-portal.html';
                } else {
                    alert("Login failed: " + (result.error || "Invalid credentials"));
                }
            } catch (error) {
                console.error("Login error:", error);
                alert("Could not connect to the server.");
            }
        }
    </script>
</body>
</html>
