<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalonConnect - Client Registration & Voting Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans flex flex-col min-h-screen">

    <!-- Navbar -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-indigo-600">SalonConnect</h1>
            <a href="landing.html" class="text-gray-600 hover:text-indigo-600 font-medium text-sm">Back to Home</a>
        </div>
    </nav>

    <!-- Registration Container -->
    <main class="max-w-md mx-auto px-4 py-12 flex-grow w-full flex items-center justify-center">
        <div class="bg-white p-8 rounded-2xl shadow-md border border-gray-100 space-y-6 w-full">
            <div class="text-center space-y-1">
                <span class="text-[10px] font-black uppercase tracking-widest text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full border border-indigo-100">Voter Portal</span>
                <h2 class="text-2xl font-black text-gray-900 mt-2">Create Voting Account</h2>
                <p class="text-xs text-gray-400">Register to cast your secure, verified vote and book appointments instantly.</p>
            </div>

            <form id="voter-register-form" onsubmit="handleVoterRegister(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wide text-gray-700 mb-1">Full Name</label>
                    <input type="text" id="voter-name" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="e.g. John Doe">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wide text-gray-700 mb-1">Username</label>
                    <input type="text" id="voter-username" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="e.g. johndoe99">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wide text-gray-700 mb-1">Phone Number</label>
                    <input type="tel" id="voter-phone" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="e.g. 082 123 4567">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wide text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="voter-email" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="client@example.com">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wide text-gray-700 mb-1">Password</label>
                    <input type="password" id="voter-password" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="••••••••">
                </div>

                <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl hover:bg-indigo-700 transition font-bold text-xs uppercase tracking-wider shadow-md shadow-indigo-100">Register & Start Voting</button>
            </form>
            
            <p class="text-xs text-center text-gray-500">
                Already have a voter account? 
                <a href="voter-login.html" class="text-indigo-600 font-bold hover:underline">Log in</a>
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white text-gray-600 py-4 border-t border-gray-200 text-center">
        <p class="text-xs text-gray-400">&copy; 2026 SalonConnect. All rights reserved.</p>
    </footer>

    <!-- Script Engine -->
    <script>
        const BACKEND_URL = window.location.hostname === 'localhost' 
    ? 'http://localhost:5000/api' 
    : 'https://salonconnect-jbo2.onrender.com/api';

        async function handleVoterRegister(event) {
            event.preventDefault();

            const name = document.getElementById('voter-name').value.trim();
            const username = document.getElementById('voter-username').value.trim();
            const phone = document.getElementById('voter-phone').value.trim();
            const email = document.getElementById('voter-email').value.trim();
            const password = document.getElementById('voter-password').value.trim();

            try {
                const response = await fetch(`${BACKEND_URL}/voters/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, username, phone, email, password })
                });

                const result = await response.json();

                if (response.ok) {
                    localStorage.setItem('voterToken', result.token);
                    localStorage.setItem('voterUser', JSON.stringify(result.voter));
                    alert("Account successfully created! You are now logged in and ready to vote.");
                    window.location.href = 'user-portal.html';
                } else {
                    alert("Registration failed: " + (result.error || "Unknown error"));
                }
            } catch (error) {
                console.error("Voter registration error:", error);
                alert("Could not connect to the server. Make sure your backend is running.");
            }
        }
    </script>
</body>
</html>
